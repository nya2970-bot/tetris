<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:'Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif}
.wrap{width:1080px;padding:40px;box-sizing:border-box}
h1{font-size:44px;margin:0 0 6px} p.s{font-size:24px;color:#666;margin:0 0 30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.c{border:3px solid #222;border-radius:18px;padding:16px;text-align:center}
.c b{display:block;font-size:30px;margin-top:6px}.c span{font-size:22px;color:#777}
svg{width:100%;height:380px}
.ln{fill:none;stroke:#222;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.bd{fill:#F3E3C7;stroke:#222;stroke-width:5;stroke-linejoin:round}
.pt{fill:#5a4632}
</style></head><body><div class="wrap">
